<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Página de entrada para um grupo no Telegram."
    />
    <title>Entre no Grupo</title>

    <style>
      :root {
        --telegram-blue: #229ed9;
        --telegram-blue-dark: #168ac5;
        --ink: #183046;
        --muted: #6b7b88;
        --canvas: #f4fbff;
        --white: #ffffff;
        --ring: rgba(34, 158, 217, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at 50% -10%, rgba(76, 186, 239, 0.22), transparent 35rem),
          radial-gradient(circle at 5% 96%, rgba(159, 221, 247, 0.29), transparent 25rem),
          var(--canvas);
      }

      .landing-page {
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow: hidden;
        padding: 24px 20px;
      }

      .entry-card {
        position: relative;
        width: min(100%, 400px);
        padding: 28px 0 20px;
        text-align: center;
      }

      .entry-card::before,
      .entry-card::after {
        position: absolute;
        z-index: -1;
        border-radius: 999px;
        content: "";
        filter: blur(3px);
      }

      .entry-card::before {
        top: 3px;
        right: -92px;
        width: 190px;
        height: 190px;
        background: rgba(42, 172, 226, 0.1);
      }

      .entry-card::after {
        bottom: -58px;
        left: -82px;
        width: 168px;
        height: 168px;
        background: rgba(42, 172, 226, 0.11);
      }

      .profile-image-placeholder {
        display: flex;
        width: 118px;
        height: 118px;
        margin: 0 auto 18px;
        align-items: center;
        justify-content: center;
        gap: 6px;
        overflow: hidden;
        border: 4px solid var(--white);
        border-radius: 50%;
        color: var(--telegram-blue-dark);
        background:
          linear-gradient(135deg, rgba(34, 158, 217, 0.18), rgba(240, 250, 255, 0.98)),
          var(--white);
        box-shadow: 0 0 0 3px var(--ring), 0 14px 30px rgba(35, 116, 159, 0.16);
      }

      .profile-image-placeholder svg {
        width: 25px;
        fill: currentColor;
      }

      .profile-image-placeholder span {
        color: #397492;
        font-size: 10px;
        font-weight: 700;
        line-height: 1.28;
        text-align: left;
        text-transform: uppercase;
      }

      .profile-image-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .verified-badge {
        position: absolute;
        top: 116px;
        left: calc(50% + 31px);
        display: grid;
        width: 27px;
        height: 27px;
        place-items: center;
        border: 3px solid var(--canvas);
        border-radius: 50%;
        background: var(--telegram-blue);
        box-shadow: 0 4px 10px rgba(24, 138, 197, 0.24);
      }

      .verified-badge svg {
        width: 18px;
        fill: var(--white);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--telegram-blue-dark);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.17em;
      }

      h1 {
        margin: 0;
        color: #17334a;
        font-size: clamp(28px, 8vw, 34px);
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .intro {
        max-width: 332px;
        margin: 16px auto 27px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }

      .telegram-button {
        display: flex;
        width: 100%;
        min-height: 61px;
        align-items: center;
        justify-content: center;
        gap: 11px;
        border-radius: 18px;
        color: var(--white);
        background: linear-gradient(135deg, #38afea, #168bc9);
        box-shadow: 0 13px 25px rgba(34, 158, 217, 0.27);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.035em;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      }

      .telegram-button svg {
        width: 20px;
        fill: currentColor;
      }

      .button-arrow {
        margin-left: 2px;
        font-size: 20px;
        font-weight: 500;
        line-height: 1;
        transition: transform 180ms ease;
      }

      .telegram-button:hover {
        filter: saturate(1.12);
        box-shadow: 0 17px 30px rgba(34, 158, 217, 0.33);
        transform: translateY(-2px);
      }

      .telegram-button:hover .button-arrow {
        transform: translateX(3px);
      }

      .telegram-button:focus-visible {
        outline: 4px solid rgba(34, 158, 217, 0.28);
        outline-offset: 4px;
      }

      .hint {
        margin: 18px 0 0;
        color: #8294a1;
        font-size: 12px;
      }

      @media (min-width: 620px) {
        .entry-card {
          padding: 44px 38px 32px;
          border: 1px solid rgba(34, 158, 217, 0.1);
          border-radius: 32px;
          background: rgba(255, 255, 255, 0.62);
          box-shadow: 0 20px 70px rgba(61, 129, 161, 0.1);
          backdrop-filter: blur(12px);
        }

        .verified-badge {
          top: 132px;
          left: calc(50% + 31px);
        }
      }

      @media (max-height: 650px) and (max-width: 619px) {
        .landing-page {
          padding-top: 12px;
          padding-bottom: 12px;
        }

        .entry-card {
          padding-top: 6px;
        }

        .profile-image-placeholder {
          width: 96px;
          height: 96px;
          margin-bottom: 12px;
        }

        .verified-badge {
          top: 76px;
        }

        .intro {
          margin-top: 11px;
          margin-bottom: 19px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
